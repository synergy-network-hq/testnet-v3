# Grafana datasource provisioning.
# Location on observer: /etc/grafana/provisioning/datasources/synergy.yml
apiVersion: 1

deleteDatasources:
  - name: prometheus
    orgId: 2

datasources:
  - name: Prometheus
    orgId: 2
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 10s
      exemplarTraceIdDestinations: []
