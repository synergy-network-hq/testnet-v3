name: Release Synergy STS CLI

on:
  push:
    tags:
      - 'synergy-sts-v*'
      - 'sts-cli-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish in synergy-network-hq/synergy-sts-cli-releases
        required: false
        type: string
      publish_release:
        description: Publish to the external CLI release repository
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark the external GitHub release as a prerelease
        required: true
        default: false
        type: boolean

concurrency:
  group: release-synergy-sts-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLI_RELEASE_REPOSITORY: synergy-network-hq/synergy-sts-cli-releases

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
            binary_suffix: ""
            rust_target: ""
            run_tests: "true"
          - os: ubuntu-24.04-arm
            label: linux-arm64
            binary_suffix: ""
            rust_target: ""
            run_tests: "true"
          - os: macos-14
            label: macos-amd64
            binary_suffix: ""
            rust_target: x86_64-apple-darwin
            run_tests: "false"
          - os: macos-14
            label: macos-arm64
            binary_suffix: ""
            rust_target: ""
            run_tests: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout SynQ and AIVM submodules
        shell: bash
        env:
          SYNQ_LANGUAGE_DEPLOY_KEY: ${{ secrets.SYNQ_LANGUAGE_DEPLOY_KEY }}
          SYNERGY_AIVM_DEPLOY_KEY: ${{ secrets.SYNERGY_AIVM_DEPLOY_KEY }}
          AEGIS_PQSYNQ_DEPLOY_KEY: ${{ secrets.AEGIS_PQSYNQ_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${SYNQ_LANGUAGE_DEPLOY_KEY}" && -n "${SYNERGY_AIVM_DEPLOY_KEY}" && -n "${AEGIS_PQSYNQ_DEPLOY_KEY}" ]]; then
            mkdir -p "${HOME}/.ssh"
            chmod 700 "${HOME}/.ssh"
            printf '%s\n' "${SYNQ_LANGUAGE_DEPLOY_KEY}" > "${HOME}/.ssh/synq_language_deploy_key"
            printf '%s\n' "${SYNERGY_AIVM_DEPLOY_KEY}" > "${HOME}/.ssh/synergy_aivm_deploy_key"
            printf '%s\n' "${AEGIS_PQSYNQ_DEPLOY_KEY}" > "${HOME}/.ssh/aegis_pqsynq_deploy_key"
            chmod 600 "${HOME}/.ssh/"*_deploy_key
            ssh-keyscan github.com >> "${HOME}/.ssh/known_hosts"

            cat > "${HOME}/.ssh/config" <<'EOF'
          Host github.com-synq-language
            HostName github.com
            User git
            IdentityFile ~/.ssh/synq_language_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes

          Host github.com-synergy-aivm
            HostName github.com
            User git
            IdentityFile ~/.ssh/synergy_aivm_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes

          Host github.com-aegis-pqsynq
            HostName github.com
            User git
            IdentityFile ~/.ssh/aegis_pqsynq_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

            git config --global url."git@github.com-synq-language:synergy-network-hq/synq-language.git".insteadOf "https://github.com/synergy-network-hq/synq-language.git"
            git config --global url."git@github.com-synergy-aivm:synergy-network-hq/synergy-aivm.git".insteadOf "https://github.com/synergy-network-hq/synergy-aivm.git"
            git config --global url."git@github.com-aegis-pqsynq:synergy-network-hq/aegis-pqsynq".insteadOf "https://github.com/synergy-network-hq/aegis-pqsynq"
          else
            echo "Deploy-key secrets are not fully configured; using public HTTPS submodule URLs."
          fi

          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.rust_target != ''
        shell: bash
        env:
          MATRIX_RUST_TARGET: ${{ matrix.rust_target }}
        run: rustup target add "${MATRIX_RUST_TARGET}"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build synergy-sts
        shell: bash
        env:
          MATRIX_RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          if [[ -n "${MATRIX_RUST_TARGET}" ]]; then
            cargo build --release --locked --target "${MATRIX_RUST_TARGET}" -p synergy-testnet --bin synergy-sts
          else
            cargo build --release --locked -p synergy-testnet --bin synergy-sts
          fi

      - name: Test synergy-sts
        if: matrix.run_tests == 'true'
        shell: bash
        run: cargo test --locked -p synergy-testnet --bin synergy-sts

      - name: Package synergy-sts
        shell: bash
        env:
          MATRIX_LABEL: ${{ matrix.label }}
          MATRIX_SUFFIX: ${{ matrix.binary_suffix }}
          MATRIX_RUST_TARGET: ${{ matrix.rust_target }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil

          label = os.environ["MATRIX_LABEL"]
          suffix = os.environ["MATRIX_SUFFIX"]
          rust_target = os.environ.get("MATRIX_RUST_TARGET", "")
          ref_name = os.environ.get("GITHUB_REF_NAME") or os.environ["GITHUB_SHA"]
          source = pathlib.Path("target")
          if rust_target:
              source = source / rust_target
          source = source / "release" / f"synergy-sts{suffix}"
          dist = pathlib.Path("dist")
          staged_name = f"synergy-sts-{label}{suffix}"
          staged = dist / staged_name

          shutil.copyfile(source, staged)
          staged.chmod(0o755)
          digest = hashlib.sha256(staged.read_bytes()).hexdigest()
          (dist / f"{staged_name}.sha256").write_text(f"{digest}  {staged_name}\n", encoding="utf-8")

          manifest = {
              "version": ref_name,
              "platform": label,
              "binary": {
                  "name": staged_name,
                  "sha256": digest,
              },
          }
          (dist / f"latest-{label}.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: synergy-sts-${{ matrix.label }}
          path: dist/*

  publish:
    name: Publish external release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/synergy-sts-v') || startsWith(github.ref, 'refs/tags/sts-cli-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${DISPATCH_TAG:-}"
            if [[ -z "${tag}" ]]; then
              tag="synergy-sts-v0.0.0-build.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:7}"
            fi
          fi
          echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Prepare release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          CLI_RELEASE_REPOSITORY: ${{ env.CLI_RELEASE_REPOSITORY }}
        run: |
          set -euo pipefail
          mkdir -p release-dist
          find artifacts -maxdepth 3 -type f -exec cp {} release-dist/ \;
          cp scripts/install-synergy-sts.sh release-dist/install-synergy-sts.sh
          chmod 0755 release-dist/install-synergy-sts.sh

          python3 <<'PY'
          import json
          import os
          import pathlib
          import textwrap
          from datetime import datetime, timezone

          release_tag = os.environ["RELEASE_TAG"]
          repo = os.environ["CLI_RELEASE_REPOSITORY"]
          dist = pathlib.Path("release-dist")
          base_url = f"https://github.com/{repo}/releases/download/{release_tag}"

          binaries = {}
          for asset in sorted(dist.glob("synergy-sts-*")):
              if asset.suffix == ".sha256":
                  continue
              platform = asset.name.removeprefix("synergy-sts-").removesuffix(".exe")
              sha_file = dist / f"{asset.name}.sha256"
              if not sha_file.exists():
                  continue
              sha = sha_file.read_text(encoding="utf-8").split()[0]
              binaries[platform] = {
                  "url": f"{base_url}/{asset.name}",
                  "sha256": sha,
              }

          latest = {
              "version": release_tag,
              "chain_id": 1264,
              "network": "testnet",
              "native_token": {
                  "symbol": "SNRG",
                  "name": "Synergy Token",
                  "decimals": 9,
                  "token_address": None,
                  "compatibility_placeholder_address": "00000000000000000000000000000000000000000",
              },
              "build_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "installers": {
                  "macos_linux": f"{base_url}/install-synergy-sts.sh",
              },
              "binaries": binaries,
          }
          (dist / "latest.json").write_text(json.dumps(latest, indent=2), encoding="utf-8")

          notes = textwrap.dedent(f"""\
          # Synergy STS CLI {release_tag}

          This release publishes standalone `synergy-sts` CLI binaries and a macOS/Linux installer.

          ## Highlights

          - Adds wallet-signed on-chain STS submission with native SNRG fee payment through `synergy_sendTransaction`.
          - Publishes release metadata with chain ID `1264`, testnet network metadata, and native SNRG token-address semantics.

          ## Install

          macOS/Linux:

          ```bash
          curl -fsSL {base_url}/install-synergy-sts.sh | bash
          ```

          ## Assets

          Each platform binary has a matching `.sha256` checksum. The installer verifies checksums by default when downloading release binaries.
          """)
          (dist / "RELEASE_NOTES.md").write_text(notes, encoding="utf-8")
          PY

      - name: Require external release token
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.SYNERGY_STS_CLI_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            echo "::error::SYNERGY_STS_CLI_RELEASES_TOKEN is required to publish to ${CLI_RELEASE_REPOSITORY}."
            echo "::error::Use a fine-grained token with Contents: Read and write on ${CLI_RELEASE_REPOSITORY}."
            exit 1
          fi

      - name: Publish release to synergy-sts-cli-releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.SYNERGY_STS_CLI_RELEASES_TOKEN }}
        with:
          repository: ${{ env.CLI_RELEASE_REPOSITORY }}
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: Synergy STS CLI ${{ steps.release.outputs.release_tag }}
          body_path: release-dist/RELEASE_NOTES.md
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          files: release-dist/*
