[package]
name = "compiler"
version = "0.1.0"
edition = "2021"

[features]
default = []
pqc-aegis = ["dep:pqsynq", "quantumvm/pqc-aegis"]

[dependencies]
pest = "2.7.7"
pest_derive = "2.7.7"
quantumvm = { path = "../vm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
pqsynq = { package = "aegis-pqsynq", path = "../aegis-pqsynq/pqsynq", default-features = false, features = ["mlkem", "mldsa", "fndsa", "hqckem"], optional = true }

[dev-dependencies]
assert_matches = "1.5.0"
