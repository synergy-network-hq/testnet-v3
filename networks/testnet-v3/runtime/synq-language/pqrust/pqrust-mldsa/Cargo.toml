[package]
name = "pqrust-mldsa"
description = "Post-Quantum Signature Scheme mldsa"
readme = "README.md"
version = "0.1.1"
authors = ["Thom Wiggers <thom@thomwiggers.nl>"]
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/rustpq/"
repository = "https://github.com/rustpq/pqrust/"
keywords = ["cryptography", "post-quantum", "security"]
categories = ["cryptography", "no-std"]

[dependencies]
pqrust-internals = { path = "../pqrust-internals" }
pqrust-traits = { path = "../pqrust-traits", default-features = false }
libc = "0.2.0"
serde = { version = "1.0", features = ["derive"], optional = true }
serde-big-array = { version = "0.5.1", optional = true }

[features]
default = ["avx2", "neon", "std"]
avx2 = ["std"]
neon = ["std"]
std = ["pqrust-traits/std"]
serialization = ["serde", "serde-big-array"]

[dev-dependencies]
rand = "0.9"

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }
glob = "0.3.0"

[badges]
travis-ci = { repository = "rustpq/pqrust", branch = "master" }
maintenance = { status = "actively-developed" }
