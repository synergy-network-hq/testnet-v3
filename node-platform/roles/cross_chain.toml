schema_version = 1
role = "cross-chain"
plane = "public"
capabilities = ["identity", "durable_storage", "telemetry", "health", "network_transport", "relay_sxcp", "resolve_uma"]

[ports]
p2p = 24004
admin = 26004
metrics = 27004

[storage]
data_directory = "/var/lib/synergy-node/cross_chain"
maximum_bytes = 107374182400
pruning = "role_policy"

[keys]
raw_export_forbidden = true
posy_signing = false

[readiness]
requires_manifest = true
requires_identity = true
requires_healthy_dependencies = true
