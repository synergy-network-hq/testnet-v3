schema_version = 1
role = "uma-coordinator"
plane = "public"
capabilities = ["identity", "durable_storage", "telemetry", "health", "network_transport", "resolve_uma"]

[ports]
p2p = 24007
admin = 26007
metrics = 27007

[storage]
data_directory = "/var/lib/synergy-node/uma_coordinator"
maximum_bytes = 107374182400
pruning = "role_policy"

[keys]
raw_export_forbidden = true
posy_signing = false

[readiness]
requires_manifest = true
requires_identity = true
requires_healthy_dependencies = true
