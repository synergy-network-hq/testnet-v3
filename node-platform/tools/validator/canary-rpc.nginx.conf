# Canary 99999 only. Enable after loopback APQE relay acceptance.
limit_req_zone $binary_remote_addr zone=canary_rpc:1m rate=20r/s;

server {
    listen 80;
    server_name canary-rpc.synergy-network.io;
    include /etc/nginx/snippets/synergy-cloudflare-origin-only.conf;
    return 308 https://canary-rpc.synergy-network.io$request_uri;
}

server {
    listen 443 ssl;
    server_name canary-rpc.synergy-network.io;
    include /etc/nginx/snippets/synergy-cloudflare-origin-only.conf;
    include /etc/nginx/snippets/synergy-cloudflare-aop.conf;
    ssl_certificate /etc/nginx/ssl/synergy/cloudflare-origin-synergy-network.pem;
    ssl_certificate_key /etc/nginx/ssl/synergy/cloudflare-origin-synergy-network.key;

    client_max_body_size 1000000;
    client_body_timeout 10s;
    limit_req zone=canary_rpc burst=40 nodelay;
    limit_req_status 429;

    location ~ ^/(rpc|healthz|network-profile)?$ {
        proxy_pass http://127.0.0.1:8552;
        proxy_http_version 1.1;
        proxy_set_header Host canary-rpc.synergy-network.io;
        proxy_set_header Connection close;
        proxy_connect_timeout 2s;
        proxy_send_timeout 12s;
        proxy_read_timeout 20s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        add_header Cache-Control no-store always;
    }

    location / {
        return 404;
    }
}
