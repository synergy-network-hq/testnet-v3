[package]
name = "synergy-aegis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha3.workspace = true
sha2 = "0.10"
aegis-pqvm = { path = "../aegis-pqvm", default-features = false, features = ["mlkem", "mldsa", "fndsa"] }
pqrust-traits = { path = "../aegis-pqvm/vendor/pqcrypto-traits" }
pqsynq = { package = "aegis-pqsynq", path = "../aegis-pqsynq/pqsynq", default-features = false, features = ["std", "mldsa"] }
synergy-protocol-types = { path = "../synergy-protocol-types" }
