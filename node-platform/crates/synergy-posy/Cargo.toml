[package]
name = "synergy-posy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Inactive qualification only: no runtime or finalized authority activation.
candidate-cluster-schedule = []

[dependencies]
synergy-posy-approval = { path = "../synergy-posy-approval", features = ["journal-serde"] }
serde.workspace = true
serde_json.workspace = true
sha3.workspace = true
blake3 = "1"
synergy-protocol-types = { path = "../synergy-protocol-types" }
synergy-address = { path = "../synergy-address" }
synergy-storage = { path = "../synergy-storage" }
rusqlite = { version = "0.32", features = ["bundled", "limits"] }
