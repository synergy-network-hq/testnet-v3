[package]
name = "synergy-execution"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Offline protocol candidate only. No node runtime or network route enables it.
engineering-processing-epoch-rollover = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
synergy-block = { path = "../synergy-block" }
synergy-etdag = { path = "../synergy-etdag" }
synergy-state = { path = "../synergy-state" }
synergy-transaction = { path = "../synergy-transaction" }
synergy-identity = { path = "../synergy-identity" }
synergy-synq = { path = "../synergy-synq" }
synergy-storage = { path = "../synergy-storage" }

[dev-dependencies]
hex = "0.4.3"
sha3.workspace = true
synergy-address = { path = "../synergy-address" }
aegis-pqvm = { path = "../aegis-pqvm", default-features = false, features = ["mldsa", "fndsa"] }
pqrust-traits = { path = "../aegis-pqvm/vendor/pqcrypto-traits" }
