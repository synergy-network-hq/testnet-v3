[package]
name = "aegis-pqsynq"
version = "0.1.0"
edition = "2021"
authors = ["Justin Hutzler"]
description = "Post-Quantum Cryptography implementation for SynQ"
license = "MIT"
repository = "https://github.com/synergy-network-hq/aegis"

[lib]
name = "pqsynq"

[dependencies]
# Core PQC implementations from the local SynQ pqrust workspace.
pqrust-mlkem = { path = "../../pqrust/pqrust-mlkem", optional = true }
pqrust-mldsa = { path = "../../pqrust/pqrust-mldsa", optional = true }
pqrust-fndsa = { path = "../../pqrust/pqrust-fndsa", optional = true }
pqrust-hqckem = { path = "../../pqrust/pqrust-hqckem", optional = true }

# Standard library features
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
sha2 = { version = "0.10", default-features = false }
pqrust-traits = { path = "../../pqrust/pqrust-traits" }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", default-features = false, features = ["std", "js"], optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[features]
default = ["mlkem", "mldsa", "fndsa", "std"]
std = ["dep:getrandom"]
mlkem = ["dep:pqrust-mlkem"]
mldsa = ["dep:pqrust-mldsa"]
fndsa = ["dep:pqrust-fndsa"]
hqckem = ["dep:pqrust-hqckem"]
full = ["std", "mlkem", "mldsa", "fndsa", "hqckem"]

[[bench]]
name = "pqc_benchmarks"
harness = false

[[example]]
name = "generate_pinned_vectors"
required-features = ["full"]
