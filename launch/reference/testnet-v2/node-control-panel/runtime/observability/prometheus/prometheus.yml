global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    network: testnet
    chain_id: "1264"

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: synergy_rpc_exporter
    static_configs:
      - targets: ["synergy-rpc-exporter:9168"]

  - job_name: monitoring_host_node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: testnet_public_p2p_probes
    metrics_path: /probe
    params:
      module: ["tcp_connect"]
    static_configs:
      - targets:
          - "bootnode1.synergynode.xyz:5620"
          - "bootnode2.synergynode.xyz:5620"
          - "bootnode3.synergynode.xyz:5620"
          - "seed1.synergynode.xyz:5621"
          - "seed2.synergynode.xyz:5621"
          - "seed3.synergynode.xyz:5621"
          - "relay1.synergynode.xyz:5622"
          - "relay2.synergynode.xyz:5622"
          - "rpc.synergynode.xyz:5623"
          - "archive.synergynode.xyz:5615"
          - "62.146.182.207:5622"
          - "62.146.182.208:5622"
          - "62.146.182.209:5622"
          - "73.79.66.255:5622"
          - "194.163.183.166:5622"
          - "157.173.192.45:5622"
          - "209.145.50.9:5622"
          - "74.208.227.23:5622"
        labels:
          probe_label: p2p_tcp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        target_label: target

  - job_name: testnet_seed_registry_metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - "seed1.synergynode.xyz:5621"
          - "seed2.synergynode.xyz:5621"
          - "seed3.synergynode.xyz:5621"
        labels:
          role: seed

  - job_name: testnet_runtime_metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - "bootnode1.synergynode.xyz:6030"
          - "bootnode2.synergynode.xyz:6030"
          - "bootnode3.synergynode.xyz:6030"
          - "relay1.synergynode.xyz:6030"
          - "relay2.synergynode.xyz:6030"
          - "rpc.synergynode.xyz:6030"
          - "archive.synergynode.xyz:6030"
          - "62.146.182.207:6030"
          - "62.146.182.208:6030"
          - "62.146.182.209:6030"
          - "73.79.66.255:6030"
          - "194.163.183.166:6030"
          - "157.173.192.45:6030"
          - "209.145.50.9:6030"
          - "74.208.227.23:6030"

  - job_name: testnet_node_exporters
    metrics_path: /metrics
    static_configs:
      - targets:
          - "bootnode1.synergynode.xyz:9100"
          - "bootnode2.synergynode.xyz:9100"
          - "bootnode3.synergynode.xyz:9100"
          - "relay1.synergynode.xyz:9100"
          - "relay2.synergynode.xyz:9100"
          - "rpc.synergynode.xyz:9100"
          - "archive.synergynode.xyz:9100"
          - "62.146.182.207:9100"
          - "62.146.182.208:9100"
          - "62.146.182.209:9100"
          - "73.79.66.255:9100"
          - "194.163.183.166:9100"
          - "157.173.192.45:9100"
          - "209.145.50.9:9100"
          - "74.208.227.23:9100"

  - job_name: testnet_public_http_probes
    metrics_path: /probe
    params:
      module: ["http_2xx"]
    static_configs:
      - targets:
          - "http://seed1.synergynode.xyz:5621/health"
          - "http://seed2.synergynode.xyz:5621/health"
          - "http://seed3.synergynode.xyz:5621/health"
          - "https://testnet-core-rpc.synergy-network.io/healthz"
          - "https://testnet-explorer.synergy-network.io/healthz"
          - "https://testnet-atlas-api.synergy-network.io/healthz"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        target_label: target
