[identity]
node_id = "genesisrpc"
role = "rpc_gateway"
role_display = "RPC Gateway"
address = ""
label = "genesisrpc"

[role]
compiled_profile = "rpc_gateway_node"
services = ["rpc-gateway"]

[network]
id = 1264
name = "synergy-testnet"
p2p_port = 5623
rpc_port = 5641
ws_port = 5661
max_peers = 128
bootnodes = []
seed_servers = []
bootstrap_dns_records = []
additional_dial_targets = []
persistent_peers = []

[blockchain]
block_time = 2
max_gas_limit = "0x2fefd8"
chain_id = 1264

[consensus]
algorithm = "Proof of Synergy"
block_time_secs = 2
epoch_length = 1000
min_validators = 3
validator_cluster_size = 6
validator_vote_threshold = 4
max_validators = 6
status_ready_gate_enabled = true
status_ready_min_validators = 4
status_ready_genesis_grace_secs = 0
allow_genesis_status_bypass = false
mesh_settle_secs = 1
leader_timeout_secs = 4
vote_timeout_secs = 2
block_timeout_secs = 6
penalization_enabled = false
synergy_score_decay_rate = 0.05
vrf_enabled = false
vrf_seed_epoch_interval = 1000
max_synergy_points_per_epoch = 100
max_tasks_per_validator = 10

[consensus.reward_weighting]
task_accuracy = 0.5
uptime = 0.3
collaboration = 0.2

[logging]
log_level = "debug"
log_file = "data/logs/genesisrpc.log"
enable_console = true
max_file_size = 10485760
max_files = 5

[rpc]
bind_address = "127.0.0.1:5641"
enable_http = true
http_port = 5641
enable_ws = true
ws_port = 5661
enable_grpc = true
grpc_port = 5641
cors_enabled = false
cors_origins = []

[p2p]
listen_address = "0.0.0.0:5623"
public_address = "testnet-core-rpc.synergy-network.io:5623"
discovery_listen_address = "0.0.0.0:5681"
discovery_public_address = "testnet-core-rpc.synergy-network.io:5681"
node_name = "genesisrpc"
enable_discovery = true
discovery_port = 5681
heartbeat_interval = 10
bootstrap_refresh_secs = 60

[storage]
database = "rocksdb"
path = "data/chain"
enable_pruning = true
pruning_interval = 86400

[node]
bootstrap_only = false
auto_register_validator = false
validator_address = ""
strict_validator_allowlist = true
allowed_validator_addresses = ["synv11qen9x0g9p0f2pqznpqzfrwkrgnsussdwmvs", "synv11s4wc6l4kg4jr0k5meg42cyzxa03cf863srt", "synv11e3ephsarcw6mey0fx5xtnygg2ewegnum4re", "synv11mka64uz049aekwhdvfrq6dvh75d0k7kmdp5", "synv11kguave5fpdpm9hru4acfvw0hcp4fcc7zv9f", "synv11zghr6nsm3ajl57ywxasw9mr5f844slq4mwx"]

[telemetry]
enabled = true
metrics_bind = "127.0.0.1:6031"
structured_logs = true
log_level = "debug"
