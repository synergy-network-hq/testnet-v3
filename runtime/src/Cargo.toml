[features]
# Opt-in: the genesis ceremony links the Synergy Address Engine for its approved
# custody decryptor. Kept behind a feature so the default library build and the
# release five-run gate are unaffected.
ceremony = []

[[bin]]
name = "synergy-genesis-ceremony"
path = "bin/synergy-genesis-ceremony.rs"
required-features = ["ceremony"]
