[package]
name = "synergy-testnet"
version = "19.0.50"
edition = "2021"

[dependencies]
# Core dependencies from workspace
rocksdb = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
sha3 = { workspace = true }
lazy_static = { workspace = true }
sha2 = "0.10"

# Additional dependencies
md5 = "0.7.0"
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls"] }
hickory-resolver = "0.26.1"
toml = "0.8.20"
rmp-serde = "1.3.0"
serde_cbor = "0.11.2"
base64 = "0.22.1"
ed25519-dalek = "2.1"
serde_yaml = "0.9.34"
blake3 = { version = "1.8.1", features = ["pure"] }
socket2 = "0.5"
chrono = "0.4"
tungstenite = "0.24"
libc = "0.2"

# Post-Quantum Cryptography
aegis-pqvm = { path = "../aegis-pqvm", default-features = false, features = ["mlkem", "mldsa", "fndsa", "security"] }
pqsynq = { package = "aegis-pqsynq", path = "../synq-language/aegis-pqsynq/pqsynq", default-features = false, features = ["std", "mldsa"] }
pqcrypto-traits = { workspace = true }
pqrust-traits = { path = "../synq-language/pqrust/pqrust-traits" }
pqcrypto-falcon = "0.3"
pqcrypto-hqc = "0.2.2"
pqcrypto-mlkem = { workspace = true }
pqcrypto-sphincsplus = "0.7.2"
rand = "0.8"
bech32 = "0.9"
aes-gcm = "0.10"

# WebAssembly VM
wasmtime = { workspace = true }
aivm-core = { path = "../synergy-aivm/runtime/aivm-core" }

# Signal handling
ctrlc = "3.4"

[lib]
name = "synergy_testnet"
path = "lib.rs"

[[bin]]
name = "synergy-testnet"
path = "main.rs"

[[bin]]
name = "generate-node-keys"
path = "../tools/generate_node_keys.rs"

[[bin]]
name = "synergy-address-engine"
path = "synergy-address-engine/src/main.rs"

[[bin]]
name = "wallet-pqc-cli"
path = "bin/wallet_pqc_cli.rs"

[[bin]]
name = "synergy-sts"
path = "bin/synergy-sts.rs"

[[bin]]
name = "synergy-rpc-gateway-node"
path = "bin/synergy-rpc-gateway-node.rs"

[[bin]]
name = "synergy-archive"
path = "bin/synergy-archive.rs"

[[bin]]
name = "synergy-archive-validator-node"
path = "bin/synergy-archive-validator-node.rs"

[[bin]]
name = "aegis-pqvm"
path = "bin/aegis-pqvm.rs"

[[bin]]
name = "synergy-node"
path = "bin/synergy-node.rs"

[[bin]]
name = "dag-tps-benchmark"
path = "bin/dag-tps-benchmark.rs"

[[bin]]
name = "pqc-benchmark"
path = "bin/pqc-benchmark.rs"

[[bin]]
name = "synergy-indexer-and-explorer-node"
path = "bin/synergy-indexer-and-explorer-node.rs"
