[network]
chain_id = 1264
network_id = "synergy-testnet-v3"
role = "ARCHIVE_OBSERVER"

[archive]
data_dir = "/Volumes/Synergy_Archive/archive-validator/workspace/data"
snapshot_dir = "/Volumes/Synergy_Archive/archive-validator/snapshots"
retain_all_blocks = true
retain_all_qcs = true
retain_all_states = true
verify_every_block = true
verify_every_qc = true
fail_closed_on_verification_error = true

[snapshots]
enabled = true
snapshot_interval_blocks = 15000
compression = "zstd"
chunk_size_bytes = 536870912
retain_verified_snapshots_per_class = 2
snapshot_classes = ["validator-pruned", "support-relayer", "support-observer", "indexer-replay", "support-rpc", "archive-full"]
publish_catalog = true
sign_manifests = true
sign_catalog = true
build_tmp_dir = "/Volumes/Synergy_Archive/archive-validator/tmp/snapshot-build"

[aegis_pqvm]
required = true
fail_closed_if_unavailable = true
archive_peer_key_role = "ARCHIVE_PEER"
snapshot_signing_key_role = "ARCHIVE_SNAPSHOT_SIGNER"

[api]
enabled = true
bind = "0.0.0.0:48640"
public_url = "http://73.79.66.255:48640"
enable_resumable_downloads = true
rate_limit_enabled = true

[p2p]
enabled = true
bind = "0.0.0.0:5622"
listen_address = "0.0.0.0:5622"
public_address = "archive.synergynode.xyz:5615"
bootnodes = []
