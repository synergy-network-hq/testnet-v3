[package]
name = "aivm-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["synq"]
synq = ["dep:quantumvm", "dep:synq-compiler", "dep:pqsynq"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = "45.0.2"
log = "0.4"
anyhow = "1.0"
sha2 = "0.10"
quantumvm = { path = "../../../../../synq-language/vm", optional = true }
synq-compiler = { package = "compiler", path = "../../../../../synq-language/compiler", optional = true }
pqsynq = { package = "aegis-pqsynq", path = "../../../../../synq-language/aegis-pqsynq/pqsynq", default-features = false, features = ["std", "mldsa"], optional = true }

[dev-dependencies]
hex = "0.4"
bech32 = "0.9"
sha3 = "0.10"
