name: Publish Existing Installer Artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run containing installer-macos and installer-linux artifacts
        required: true
      tag:
        description: Release tag to publish
        required: true

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate release inputs
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use vMAJOR.MINOR.PATCH format." >&2
            exit 1
          }
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout matching source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Verify source version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          source_version="$(node -p "require('./package.json').version")"
          [[ "$source_version" == "$RELEASE_VERSION" ]] || {
            echo "Source version $source_version does not match release $RELEASE_VERSION." >&2
            exit 1
          }

      - name: Verify source workflow run provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id must be numeric" >&2; exit 1; }
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          run_sha="$(jq -r '.head_sha' <<<"$run_json")"
          run_status="$(jq -r '.status' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          source_sha="$(git rev-parse HEAD)"
          [[ "$run_status" == "completed" && "$run_conclusion" == "success" ]] || {
            echo "Workflow run ${SOURCE_RUN_ID} is not a completed successful run." >&2
            exit 1
          }
          [[ "$run_sha" == "$source_sha" ]] || {
            echo "Workflow run ${SOURCE_RUN_ID} built ${run_sha}, but ${RELEASE_TAG} resolves to ${source_sha}." >&2
            exit 1
          }

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: release-assets/macos
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download Linux installers
        uses: actions/download-artifact@v4
        with:
          name: installer-linux
          path: release-assets/linux
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify installer artifact set
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          require_asset() {
            local label="$1"
            local pattern="$2"
            compgen -G "$pattern" >/dev/null || {
              echo "Missing required ${label} asset matching ${pattern}" >&2
              find release-assets -maxdepth 3 -type f -print >&2 || true
              exit 1
            }
          }
          require_asset "macOS DMG" "release-assets/macos/Synergy.Node.Control.Panel-${RELEASE_VERSION}-arm64.dmg"
          require_asset "macOS ZIP" "release-assets/macos/Synergy.Node.Control.Panel-${RELEASE_VERSION}-arm64.zip"
          require_asset "macOS update metadata" 'release-assets/macos/*.yml'
          require_asset "Linux Debian package" "release-assets/linux/synergy-node-control-panel_${RELEASE_VERSION}_amd64.deb"
          require_asset "Linux AppImage" "release-assets/linux/Synergy.Node.Control.Panel-${RELEASE_VERSION}.AppImage"
          require_asset "Linux update metadata" 'release-assets/linux/*.yml'
          while IFS= read -r metadata; do
            grep -Eq "^version:[[:space:]]*['\"]?${RELEASE_VERSION}['\"]?[[:space:]]*$" "$metadata" || {
              echo "Updater metadata $metadata does not declare version ${RELEASE_VERSION}." >&2
              exit 1
            }
            grep -Fq "$RELEASE_VERSION" "$metadata" || {
              echo "Updater metadata $metadata does not reference versioned assets." >&2
              exit 1
            }
          done < <(find release-assets -type f -name '*.yml' -print)

      - name: Create operator manual archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="release-assets/Synergy.Node.Control.Panel-${RELEASE_VERSION}-operator-manual.tar.gz"
          tar -czf "$archive" -C docs \
            operator-manual/README.md \
            operator-manual/macos.md \
            operator-manual/ubuntu-desktop.md \
            operator-manual/headless-ubuntu-linux.md \
            operator-manual/validator-lifecycle.md
          tar -tzf "$archive" > "$RUNNER_TEMP/operator-manual-files.txt"
          grep -Fxq 'operator-manual/README.md' "$RUNNER_TEMP/operator-manual-files.txt"
          grep -Fxq 'operator-manual/macos.md' "$RUNNER_TEMP/operator-manual-files.txt"
          grep -Fxq 'operator-manual/ubuntu-desktop.md' "$RUNNER_TEMP/operator-manual-files.txt"
          grep -Fxq 'operator-manual/headless-ubuntu-linux.md' "$RUNNER_TEMP/operator-manual-files.txt"
          grep -Fxq 'operator-manual/validator-lifecycle.md' "$RUNNER_TEMP/operator-manual-files.txt"
          test -s "$archive"

      - name: Create release checksums
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  release-assets/#  #' > release-assets/SHA256SUMS
          test -s release-assets/SHA256SUMS

      - name: Publish complete installer release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          repo="synergy-network-hq/synergy-node-control-panel-releases"
          title="Synergy Node Control Panel ${RELEASE_TAG#v}"
          notes="Signed installer artifacts from ${GITHUB_REPOSITORY} workflow run ${SOURCE_RUN_ID}."
          if ! gh release view "$RELEASE_TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$repo" --title "$title" --notes "$notes"
          else
            gh release edit "$RELEASE_TAG" --repo "$repo" --title "$title" --notes "$notes"
          fi
          find release-assets -type f -print0 \
            | xargs -0 gh release upload "$RELEASE_TAG" --repo "$repo" --clobber
