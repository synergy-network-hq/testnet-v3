[identity]
node_id = "validator-node-01"
role = "validator"
role_display = "validator"
address = ""
label = "validator-node-01"

[role]
compiled_profile = "validator_node"
services = []

[network]
id = 1266
name = "synergy-testnet"
p2p_port = 5622
rpc_port = 5640
ws_port = 5660
max_peers = 100
bootnodes = []
seed_servers = []
bootstrap_dns_records = []
additional_dial_targets = ["195.26.241.95:5622", "94.72.117.108:5622"]
persistent_peers = ["195.26.241.95:5622", "94.72.117.108:5622"]

[blockchain]
block_time = 2
max_gas_limit = "0x2fefd8"
chain_id = 1266

[consensus]
algorithm = "Proof of Synergy"
block_time_secs = 2
epoch_length = 1000
emergency_stable_committee_mode = false
freeze_validator_set = false
freeze_score_weighted_proposer_order = false
vote_only_rejoin_enabled = true
vote_only_probation_blocks = 1000
min_validators = 4
validator_cluster_size = 6
validator_vote_threshold = 0
max_validators = 0
status_ready_gate_enabled = true
status_ready_min_validators = 4
status_ready_genesis_grace_secs = 0
allow_genesis_status_bypass = false
mesh_settle_secs = 1
leader_timeout_secs = 4
vote_timeout_secs = 2
block_timeout_secs = 6
penalization_enabled = false
synergy_score_decay_rate = 0.05
vrf_enabled = true
vrf_seed_epoch_interval = 1000
max_synergy_points_per_epoch = 100
max_tasks_per_validator = 10

[consensus.reward_weighting]
task_accuracy = 0.5
uptime = 0.3
collaboration = 0.2

[logging]
log_level = "debug"
log_file = "data/logs/validator.log"
enable_console = true
max_file_size = 10485760
max_files = 5

[rpc]
bind_address = "127.0.0.1:5640"
enable_http = true
http_port = 5640
enable_ws = true
ws_port = 5660
enable_grpc = true
grpc_port = 5640
cors_enabled = false
cors_origins = []

[p2p]
listen_address = "0.0.0.0:5622"
public_address = "replace-with-public-host:5622"
node_name = "validator-node-01"
enable_discovery = false
discovery_port = 5680
discovery_listen_address = "0.0.0.0:5680"
discovery_public_address = "replace-with-public-host:5680"
heartbeat_interval = 10
bootstrap_refresh_secs = 3600

[storage]
database = "rocksdb"
path = "data/chain"
enable_pruning = false
pruning_interval = 86400

[node]
bootstrap_only = false
auto_register_validator = false
validator_address = ""
strict_validator_allowlist = false
allowed_validator_addresses = ["synv11yc4cjehqjm6fp0ey4ppjptv0p3cwdy6r79t", "synv11k0vlmkt5gyp3czlgvlfm5yqkxu5nyvp4ekk", "synv11jk9pprkz7faykn4ez7hzaj2q7lg04l2fjgj", "synv11s7hag82s6d9f8urrv5cl40lyeamxelthpeg", "synv11cl92kxcx4jyzusecqydrxc8aj3hsgscrvtu", "synv1129lck2uvz73f59wd3yame0w04qnrdpmmmfc"]

[telemetry]
enabled = true
metrics_bind = "127.0.0.1:6030"
structured_logs = true
log_level = "debug"
