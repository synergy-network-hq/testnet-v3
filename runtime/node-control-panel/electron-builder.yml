appId: io.synergy-network.node-control-panel
productName: Synergy Node Control Panel

directories:
  output: electron-dist
  buildResources: control-service/icons

files:
  - dist/**/*
  - electron/**/*
  - package.json

extraResources:
  - from: build/electron-runtime/control-service
    to: control-service
  - from: binaries
    to: binaries
    filter:
      - "**/*"
      - "!**/*.exe"
      - "!**/*.exe.sha256"
  - from: binaries/innernet
    to: innernet
  - from: testnet/runtime
    to: testnet/runtime
    filter:
      - "**/*"
      # Validator setup packages are release-prep inputs, never generic
      # installer payload. The panel receives only assignment metadata and an
      # opaque one-time claim during enrollment.
      - "!keys/**"
      - "!**/keys/**"
      - "!**/setup-package.json"
      - "!**/*.private"
      - "!**/*.private.*"
      - "!**/*.exe"
      - "!**/*.exe.sha256"
  - from: scripts/testnet
    to: scripts/testnet
  - from: scripts/cleanup
    to: scripts/cleanup
  - from: scripts/reset-testnet.sh
    to: scripts/reset-testnet.sh
  - from: guides/SYNERGY_TESTNET_CONTROL_PANEL_USER_MANUAL.md
    to: guides/SYNERGY_TESTNET_CONTROL_PANEL_USER_MANUAL.md
  - from: docs/operator-manual
    to: operator-manual

publish:
  provider: github
  owner: synergy-network-hq
  repo: synergy-node-control-panel-releases

dmg:
  background: control-service/icons/background.png
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

mac:
  category: public.app-category.developer-tools
  icon: control-service/icons/control-panel-app-icon.icon
  forceCodeSigning: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  artifactName: "Synergy.Node.Control.Panel-${version}-${arch}.${ext}"
  target:
    - dmg
    - zip

# Windows installers are intentionally disabled while Windows support is paused.
# Re-enable this block together with the windows-latest GitHub Actions matrix entry
# and the Windows binary validation/copy steps in .github/workflows/release.yml.
# win:
#   icon: control-service/icons/icon.ico
#   target:
#     - nsis
#
# nsis:
#   oneClick: false
#   perMachine: false
#   allowToChangeInstallationDirectory: true

linux:
  icon: control-service/icons
  target:
    - deb
    - AppImage
