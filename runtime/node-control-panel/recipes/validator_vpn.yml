id: validator_vpn
name: Validator VPN
role: validator_vpn
description: Dynamic validator-only WireGuard transport coordinated by the node control panel.

validator_vpn:
  enabled: true
  network: synergy-validator-vpn-testnet
  interface: sy-validator0
  cidr: 10.70.0.0/16
  listen_port: 51820
  mtu: 1380
  peer_update_interval: 30s
  persistent_keepalive: 25

  relayer_range: 10.70.20.0/24
  validator_range: 10.70.10.0/24
  validator_start_ip: 10.70.10.1
  validator_end_ip: 10.70.10.254

  bootstrap_nodes:
    relayers:
      relayer-1: 10.70.20.1/32
      relayer-2: 10.70.20.2/32
      relayer-3: 10.70.20.3/32
    validators:
      validator-1: 10.70.10.1/32
      validator-2: 10.70.10.2/32
      validator-3: 10.70.10.3/32
      validator-4: 10.70.10.4/32
      validator-5: 10.70.10.5/32
      validator-6: 10.70.10.6/32

  health:
    require_relayers_reachable: 3
    require_min_validator_peers_reachable: 3
    degraded_after_no_heartbeat: 5m
    inactive_after_no_wireguard_handshake: 15m
    quarantine_after_inactive: 24h
    ip_tombstone_duration: 30d
    max_clock_drift: 100ms

  onboarding:
    autonomous_validator_enrollment: true
    require_team_approval_for_validators: false
    require_operator_manual_wireguard_config: false
    require_validator_signature: true
    require_chain_eligibility: true
    allow_non_validator_nodes: false
