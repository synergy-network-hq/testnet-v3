[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[features]
default = []
pqc-aegis = ["compiler/pqc-aegis", "quantumvm/pqc-aegis"]

[dependencies]
clap = { version = "4.4.18", features = ["derive"] }
compiler = { path = "../compiler" }
hex = "0.4"
pqsynq = { package = "aegis-pqsynq", path = "../aegis-pqsynq/pqsynq", default-features = false, features = ["std", "mldsa"] }
quantumvm = { path = "../vm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"
tempfile = "3.10.1"
