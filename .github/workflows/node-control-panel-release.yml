name: Testnet-v3 Node Control Panel Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AEGIS_PQVM_SOURCE_REPOSITORY: ${{ vars.AEGIS_PQVM_SOURCE_REPOSITORY || 'synergy-network-hq/aegis-pqvm' }}
  AEGIS_PQVM_SOURCE_REV: ${{ vars.AEGIS_PQVM_SOURCE_REV || '6756777e43cf7ed772fb0535055e0447b3c031db' }}
  TESTNET_V3_SOURCE_REPOSITORY: synergy-network-hq/testnet-v3
  SYNQ_LANGUAGE_SOURCE_REPOSITORY: ${{ vars.SYNQ_LANGUAGE_SOURCE_REPOSITORY || 'synergy-network-hq/synq-language' }}
  SYNQ_LANGUAGE_SOURCE_REV: ${{ vars.SYNQ_LANGUAGE_SOURCE_REV || 'bee71d2af32f6cbf68955fa5bce38a34692cea87' }}
  ADDRESS_ENGINE_SOURCE_REPOSITORY: ${{ vars.ADDRESS_ENGINE_SOURCE_REPOSITORY || 'synergy-network-hq/synergy-address-engine' }}
  ADDRESS_ENGINE_SOURCE_REV: ${{ vars.ADDRESS_ENGINE_SOURCE_REV || '94422c42a3a9ba1e5aa300a37a488b9edc174869' }}
  INNERNET_SOURCE_REPOSITORY: ${{ vars.INNERNET_SOURCE_REPOSITORY || 'tonarino/innernet' }}
  INNERNET_SOURCE_REV: ${{ vars.INNERNET_SOURCE_REV || 'dbdb0097b397fa5b10566ae58d33c699142102f2' }}

# The repository houses the desktop app under runtime/node-control-panel.
# GitHub discovers this workflow only from the repository root, so every
# shell step runs from the app directory.
defaults:
  run:
    working-directory: runtime/node-control-panel

jobs:
  verify-release-identity:
    name: Verify release identity
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: version
        name: Validate version and tag identity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          package_lock_version="$(node -p "require('./package-lock.json').version")"
          package_lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          cargo_version="$(awk -F' = ' '/^version = / { gsub(/"/, "", $2); print $2; exit }' control-service/Cargo.toml)"
          runtime_version="$(awk -F'"' '/^version = / { print $2; exit }' "$GITHUB_WORKSPACE/runtime/src/Cargo.toml")"
          [[ -n "$package_version" ]] || { echo "package.json version is empty" >&2; exit 1; }
          [[ "$package_lock_version" == "$package_version" ]] || {
            echo "package-lock.json version ($package_lock_version) does not match package.json ($package_version)" >&2
            exit 1
          }
          [[ "$package_lock_root_version" == "$package_version" ]] || {
            echo "package-lock root version ($package_lock_root_version) does not match package.json ($package_version)" >&2
            exit 1
          }
          [[ "$cargo_version" == "$package_version" ]] || {
            echo "control-service version ($cargo_version) does not match package.json ($package_version)" >&2
            exit 1
          }
          [[ "$runtime_version" == "$package_version" ]] || {
            echo "Testnet-v3 runtime version ($runtime_version) does not match package.json ($package_version)" >&2
            exit 1
          }
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected_tag="v${package_version}"
            [[ "${GITHUB_REF_NAME}" == "$expected_tag" ]] || {
              echo "Release tag ${GITHUB_REF_NAME} does not match ${expected_tag}" >&2
              exit 1
            }
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  verify-archive-readiness:
    name: Verify public archive readiness
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout canonical Aegis-PQVM source
        shell: bash
        env:
          AEGIS_PQVM_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$AEGIS_PQVM_SOURCE_REV" =~ ^[0-9a-f]{40}$ ]] || {
            echo "AEGIS_PQVM_SOURCE_REV must be a full immutable commit SHA" >&2
            exit 1
          }
          aegis_root="$GITHUB_WORKSPACE/aegis-pqvm-source"
          mkdir -p "$aegis_root"
          pushd "$aegis_root" >/dev/null
          git init --quiet
          git remote add origin "https://github.com/${AEGIS_PQVM_SOURCE_REPOSITORY}.git"
          if [[ -n "${AEGIS_PQVM_REPO_TOKEN:-}" ]]; then
            auth_header="$(printf 'x-access-token:%s' "$AEGIS_PQVM_REPO_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --depth 1 origin "$AEGIS_PQVM_SOURCE_REV"
          else
            git fetch --depth 1 origin "$AEGIS_PQVM_SOURCE_REV"
          fi
          git checkout --detach --quiet FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$AEGIS_PQVM_SOURCE_REV" ]]
          popd >/dev/null

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build canonical archive verifier
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-aegis-snapshot-verifier.sh \
            --aegis-pqvm "$GITHUB_WORKSPACE/aegis-pqvm-source" \
            --output "$RUNNER_TEMP/synergy-aegis-linux-amd64"
          "$RUNNER_TEMP/synergy-aegis-linux-amd64" --version

      - name: Verify public archive catalog and signer
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/qa/archive-readiness-preflight-test.mjs
          node scripts/release/archive-readiness-preflight.mjs \
            --verifier "$RUNNER_TEMP/synergy-aegis-linux-amd64"

  build-linux-onboarding-sidecars:
    name: Build native Linux onboarding sidecars
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native Linux sidecars
        shell: bash
        run: |
          set -euo pipefail
          CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu bash scripts/build-sidecars.sh
          test -x binaries/synergy-control-linux-amd64
          test -x binaries/synergy-testnet-agent-linux-amd64
          file binaries/synergy-control-linux-amd64 | grep -q 'ELF 64-bit'
          file binaries/synergy-testnet-agent-linux-amd64 | grep -q 'ELF 64-bit'

      - name: Upload native Linux sidecars
        uses: actions/upload-artifact@v4
        with:
          name: linux-onboarding-sidecars
          if-no-files-found: error
          retention-days: 1
          path: |
            runtime/node-control-panel/binaries/synergy-control-linux-amd64
            runtime/node-control-panel/binaries/synergy-testnet-agent-linux-amd64

  build-testnet-v3-runtime:
    name: Build Testnet-v3 runtime (${{ matrix.platform }})
    needs:
      - verify-release-identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-amd64
            output_name: synergy-testnet-linux-amd64
          - os: macos-26
            platform: macos-arm64
            output_name: synergy-testnet-darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout tagged Testnet-v3 source
        uses: actions/checkout@v4

      - name: Verify canonical Testnet-v3 source repository
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "${TESTNET_V3_SOURCE_REPOSITORY}" ]] || {
            echo "Control Panel release builds must run from ${TESTNET_V3_SOURCE_REPOSITORY}; got ${GITHUB_REPOSITORY}." >&2
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout pinned canonical SynQ dependency
        shell: bash
        env:
          SYNQ_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SYNQ_LANGUAGE_SOURCE_REV" =~ ^[0-9a-f]{40}$ ]] || {
            echo "SYNQ_LANGUAGE_SOURCE_REV must be a full immutable commit SHA." >&2
            exit 1
          }
          synq_root="${GITHUB_WORKSPACE}/../synq-language"
          git init --quiet "$synq_root"
          git -C "$synq_root" remote add origin "https://github.com/${SYNQ_LANGUAGE_SOURCE_REPOSITORY}.git"
          if [[ -n "${SYNQ_REPO_TOKEN:-}" ]]; then
            auth_header="$(printf 'x-access-token:%s' "$SYNQ_REPO_TOKEN" | base64 | tr -d '\n')"
            git -C "$synq_root" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --depth 1 origin "$SYNQ_LANGUAGE_SOURCE_REV"
          else
            git -C "$synq_root" fetch --depth 1 origin "$SYNQ_LANGUAGE_SOURCE_REV"
          fi
          git -C "$synq_root" checkout --detach --quiet FETCH_HEAD
          [[ "$(git -C "$synq_root" rev-parse HEAD)" == "$SYNQ_LANGUAGE_SOURCE_REV" ]]
          if [[ -n "${SYNQ_REPO_TOKEN:-}" ]]; then
            git -C "$synq_root" \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
              submodule update --init --recursive
          else
            git -C "$synq_root" submodule update --init --recursive
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux runtime build dependencies
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev

      - name: Build tagged Testnet-v3 runtime
        shell: bash
        run: |
          set -euo pipefail
          panel_version="$(node -p "require('./package.json').version")"
          runtime_version="$(awk -F '"' '/^version = / { print $2; exit }' "$GITHUB_WORKSPACE/runtime/src/Cargo.toml")"
          [[ "$runtime_version" == "$panel_version" ]] || {
            echo "Testnet-v3 runtime version $runtime_version does not match Control Panel $panel_version." >&2
            exit 1
          }
          cargo build --manifest-path "$GITHUB_WORKSPACE/runtime/Cargo.toml" \
            --package synergy-testnet --bin synergy-testnet --release
          source_binary="$GITHUB_WORKSPACE/runtime/target/release/synergy-testnet"
          test -x "$source_binary"
          mkdir -p .release-runtime
          install -m 0755 "$source_binary" ".release-runtime/${{ matrix.output_name }}"
          reported_version="$(".release-runtime/${{ matrix.output_name }}" --version | head -n 1)"
          [[ "$reported_version" == "Synergy Testnet Node v$panel_version" ]] || {
            echo "Built runtime reported '$reported_version', expected v$panel_version." >&2
            exit 1
          }
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const platform = process.env.RUNTIME_PLATFORM;
          const outputName = process.env.RUNTIME_OUTPUT_NAME;
          const binaryPath = path.join('.release-runtime', outputName);
          const sha256 = crypto.createHash('sha256').update(fs.readFileSync(binaryPath)).digest('hex');
          const version = require('./package.json').version;
          fs.writeFileSync(
            path.join('.release-runtime', `testnet-v3-runtime-${platform}.json`),
            `${JSON.stringify({
              schema_version: 1,
              network_id: 'synergy-testnet-v3',
              source_repository: process.env.GITHUB_REPOSITORY,
              source_revision: process.env.GITHUB_SHA,
              version: `v${version}`,
              platform,
              binary: { name: 'synergy-testnet', file: outputName, sha256 },
            }, null, 2)}\n`,
          );
          NODE
        env:
          RUNTIME_PLATFORM: ${{ matrix.platform }}
          RUNTIME_OUTPUT_NAME: ${{ matrix.output_name }}

      - name: Upload Testnet-v3 runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: testnet-v3-runtime-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
          path: runtime/node-control-panel/.release-runtime

  build:
    needs:
      - verify-release-identity
      - verify-archive-readiness
      - build-linux-onboarding-sidecars
      - build-testnet-v3-runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            artifact_name: macos
            build_cmd: npx electron-builder --config electron-builder.yml --mac dmg zip --publish never
            artifact_glob: |
              runtime/node-control-panel/electron-dist/*.dmg
              runtime/node-control-panel/electron-dist/*.zip
              runtime/node-control-panel/electron-dist/*.yml
              runtime/node-control-panel/electron-dist/*.yaml
              runtime/node-control-panel/electron-dist/*.blockmap
          - os: ubuntu-22.04
            artifact_name: linux
            build_cmd: npx electron-builder --config electron-builder.yml --linux deb AppImage --publish never
            artifact_glob: |
              runtime/node-control-panel/electron-dist/*.deb
              runtime/node-control-panel/electron-dist/*.AppImage
              runtime/node-control-panel/electron-dist/*.yml
              runtime/node-control-panel/electron-dist/*.yaml
              runtime/node-control-panel/electron-dist/*.blockmap
          # Windows installer builds are intentionally disabled while Windows support is paused.
          # Re-enable this matrix entry together with a native Windows Testnet-v3 runtime build.
          # - os: windows-latest
          #   artifact_name: windows
          #   build_cmd: npx electron-builder --config electron-builder.yml --win nsis --publish never
          #   artifact_glob: |
          #     electron-dist/*.exe
          #     electron-dist/*.yml
          #     electron-dist/*.yaml
          #     electron-dist/*.blockmap

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout canonical Aegis-PQVM source
        shell: bash
        env:
          AEGIS_PQVM_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail

          AEGIS_PQVM_SOURCE_REPOSITORY="${AEGIS_PQVM_SOURCE_REPOSITORY:-synergy-network-hq/aegis-pqvm}"
          AEGIS_PQVM_SOURCE_REV="${AEGIS_PQVM_SOURCE_REV:?Set AEGIS_PQVM_SOURCE_REV to a full canonical commit SHA.}"
          [[ "$AEGIS_PQVM_SOURCE_REV" =~ ^[0-9a-f]{40}$ ]] || {
            echo "AEGIS_PQVM_SOURCE_REV must be a full immutable commit SHA" >&2
            exit 1
          }

          aegis_root="$GITHUB_WORKSPACE/aegis-pqvm-source"
          mkdir -p "$aegis_root"
          pushd "$aegis_root" >/dev/null
          git init --quiet
          git remote add origin "https://github.com/${AEGIS_PQVM_SOURCE_REPOSITORY}.git"
          if [[ -n "${AEGIS_PQVM_REPO_TOKEN:-}" ]]; then
            auth_header="$(printf 'x-access-token:%s' "$AEGIS_PQVM_REPO_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --depth 1 origin "$AEGIS_PQVM_SOURCE_REV"
          else
            git fetch --depth 1 origin "$AEGIS_PQVM_SOURCE_REV"
          fi
          git checkout --detach --quiet FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$AEGIS_PQVM_SOURCE_REV" ]] || {
            echo "Fetched Aegis-PQVM revision does not match the configured immutable source revision" >&2
            exit 1
          }
          popd >/dev/null

      - name: Checkout validator identity decryptor source
        shell: bash
        env:
          ADDRESS_ENGINE_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$ADDRESS_ENGINE_SOURCE_REV" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ADDRESS_ENGINE_SOURCE_REV must be a full immutable commit SHA" >&2
            exit 1
          }
          address_engine_root="$GITHUB_WORKSPACE/address-engine-source"
          mkdir -p "$address_engine_root"
          pushd "$address_engine_root" >/dev/null
          git init --quiet
          git remote add origin "https://github.com/${ADDRESS_ENGINE_SOURCE_REPOSITORY}.git"
          if [[ -n "${ADDRESS_ENGINE_REPO_TOKEN:-}" ]]; then
            auth_header="$(printf 'x-access-token:%s' "$ADDRESS_ENGINE_REPO_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --depth 1 origin "$ADDRESS_ENGINE_SOURCE_REV"
          else
            git fetch --depth 1 origin "$ADDRESS_ENGINE_SOURCE_REV"
          fi
          git checkout --detach --quiet FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$ADDRESS_ENGINE_SOURCE_REV" ]]
          popd >/dev/null

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download native Linux remote onboarding sidecars
        uses: actions/download-artifact@v4
        with:
          name: linux-onboarding-sidecars
          path: runtime/node-control-panel/.release-sidecars

      - name: Stage native Linux remote onboarding sidecars
        shell: bash
        run: |
          set -euo pipefail
          for binary in synergy-control-linux-amd64 synergy-testnet-agent-linux-amd64; do
            source_path="$(find .release-sidecars -type f -name "$binary" -print -quit)"
            [[ -n "$source_path" ]] || {
              echo "Required native Linux sidecar was not present in the workflow artifact: $binary" >&2
              find .release-sidecars -maxdepth 3 -type f -print >&2 || true
              exit 1
            }
            install -m 0755 "$source_path" "binaries/$binary"
          done

      - name: Verify native Linux remote onboarding sidecars
        shell: bash
        run: |
          set -euo pipefail
          test -x binaries/synergy-control-linux-amd64
          test -x binaries/synergy-testnet-agent-linux-amd64
          file binaries/synergy-control-linux-amd64 | grep -q 'ELF 64-bit'
          file binaries/synergy-testnet-agent-linux-amd64 | grep -q 'ELF 64-bit'

      - name: Build official Innernet client CLI
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            targets=("darwin-arm64" "linux-amd64")
            rustup target add x86_64-unknown-linux-gnu
            if ! command -v cargo-zigbuild >/dev/null 2>&1; then
              cargo install cargo-zigbuild --locked
            fi
            if ! command -v zig >/dev/null 2>&1; then
              brew install zig
            fi
          elif [[ "${RUNNER_OS}" == "Linux" ]]; then
            targets=("linux-amd64")
            sudo apt-get update
            sudo apt-get install -y wireguard-tools
          else
            echo "Unsupported runner OS for Innernet client build: ${RUNNER_OS}" >&2
            exit 1
          fi

          rm -rf binaries/innernet
          node scripts/electron/build-innernet.mjs $(printf -- '--target %q ' "${targets[@]}")
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            brew install wireguard-go wireguard-tools
            install -m 0755 "$(command -v wireguard-go)" binaries/innernet/wireguard-go
            install -m 0755 "$(command -v wg)" binaries/innernet/wg
            install -m 0755 "$(command -v wg-quick)" binaries/innernet/wg-quick
            file binaries/innernet/wireguard-go | grep -q 'Mach-O 64-bit executable arm64'
            file binaries/innernet/wg | grep -q 'Mach-O 64-bit executable arm64'
          else
            install -m 0755 "$(command -v wg)" binaries/innernet/wg
            install -m 0755 "$(command -v wg-quick)" binaries/innernet/wg-quick
          fi
          for binary in binaries/innernet/*; do
            [[ "${binary}" == *.json ]] && continue
            test -x "${binary}"
            if [[ "${RUNNER_OS}" == "macOS" && "${binary}" == *linux-* ]]; then
              continue
            fi
            if [[ "${binary}" == */wireguard-go ]]; then
              continue
            fi
            if [[ "${binary}" == */wg-quick ]]; then
              head -n 1 "${binary}" | grep -q '^#!'
              continue
            fi
            "${binary}" --version
          done

      - name: Build packaged validator identity decryptor
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path "$GITHUB_WORKSPACE/address-engine-source/Cargo.toml" \
            --release --bin synergy-keygen
          case "${RUNNER_OS}" in
            macOS) keygen_name="synergy-keygen-darwin-arm64" ;;
            Linux) keygen_name="synergy-keygen-linux-amd64" ;;
            *) echo "Unsupported validator identity platform: ${RUNNER_OS}" >&2; exit 1 ;;
          esac
          install -m 0755 \
            "$GITHUB_WORKSPACE/address-engine-source/target/release/synergy-keygen" \
            "binaries/${keygen_name}"
          "binaries/${keygen_name}" --help >/dev/null

      - name: Install release validation tools
        shell: bash
        run: |
          set -euo pipefail

          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ripgrep
              ;;
            macOS)
              brew install ripgrep
              ;;
            Windows)
              choco install ripgrep --yes --no-progress
              ;;
            *)
              echo "Unsupported runner OS for release validation tools: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

          rg --version

      - name: Validate Testnet genesis alignment
        shell: bash
        env:
          TESTNET_V3_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          (async () => {
            const sourceRoot = process.env.TESTNET_V3_SOURCE_ROOT;
            if (!sourceRoot) {
              throw new Error('TESTNET_V3_SOURCE_ROOT is required');
            }
            const readJson = (filePath) => JSON.parse(fs.readFileSync(filePath, 'utf8'));
            const firstExisting = (...filePaths) => {
              const filePath = filePaths.find((candidate) => fs.existsSync(candidate));
              if (!filePath) {
                throw new Error(`None of the required files exist: ${filePaths.join(', ')}`);
              }
              return filePath;
            };
            const readGenesisIdentity = (filePath) => {
              const payload = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              const hash = payload?.integrity?.genesis_hash;
              if (!hash) {
                throw new Error(`${filePath} is missing integrity.genesis_hash`);
              }
              return {
                chainId: payload?.network?.chain_id,
                nativeNetworkId: payload?.network?.network_id,
                hash: String(hash).trim().toLowerCase(),
                magic: String(
                  payload?.network_magic_bytes?.value
                  || payload?.p2p_identity?.network_magic_bytes
                  || '',
                ).trim().toLowerCase(),
                chainIdHex: String(
                  payload?.network_identity?.synergy_native_chain_id_hex
                  || `0x${Number(payload?.network?.chain_id).toString(16)}`
                  || '',
                ).trim().toLowerCase(),
                launchStatus: String(payload?.launch_status || '').trim(),
                signedBy: Array.isArray(payload?.integrity?.signed_by)
                  ? payload.integrity.signed_by.length
                  : 0,
                validatorCount: Array.isArray(payload?.validators)
                  ? payload.validators.length
                  : 0,
              };
            };

            const sourceGenesisPath = firstExisting(
              path.join(sourceRoot, 'runtime/config/genesis.json'),
              path.join(sourceRoot, 'config/genesis.json'),
            );
            const source = readGenesisIdentity(sourceGenesisPath);
            const bundled = readGenesisIdentity('testnet/runtime/configs/genesis/genesis.json');
            if (source.hash !== bundled.hash || source.magic !== bundled.magic || source.chainId !== bundled.chainId || source.nativeNetworkId !== bundled.nativeNetworkId) {
              throw new Error(`Bundled genesis does not match testnet source. source=${JSON.stringify(source)} bundled=${JSON.stringify(bundled)}`);
            }
            for (const [label, identity] of [['source', source], ['bundled', bundled]]) {
              if (
                !/^[0-9a-f]{64}$/.test(identity.hash)
                || /^0{64}$/.test(identity.hash)
                || !/^[0-9a-f]{8}$/.test(identity.magic)
                || identity.launchStatus
                || identity.signedBy < 1
                || identity.validatorCount < 6
              ) {
                throw new Error(`${label} genesis is not an approved, signed Testnet-v3 genesis: ${JSON.stringify(identity)}`);
              }
            }
            if (bundled.chainId !== 1266 || bundled.nativeNetworkId !== 1266 || bundled.chainIdHex !== '0x4f2') {
              throw new Error(`Bundled genesis must be Testnet-v3 chain 1266. got=${JSON.stringify(bundled)}`);
            }

            const identifiersPath = firstExisting(
              path.join(sourceRoot, 'network-identifiers.testnet-v3.json'),
              path.join(sourceRoot, 'network-identifiers.testnet-v3.identity-assigned.json'),
              path.join(sourceRoot, 'runtime/network-identifiers.testnet.json'),
            );
            const identifiers = readJson(identifiersPath);
            const identifierHash = String(identifiers?.cryptographic_identity?.genesis_hash || '').trim().toLowerCase();
            const identifierMagic = String(identifiers?.cryptographic_identity?.network_magic_bytes?.value || '').trim().toLowerCase();
            const identifierChainHex = String(identifiers?.wallet_metadata?.wallet_add_network_payload?.chainId || '').trim().toLowerCase();
            const identifierStatus = String(identifiers?.cryptographic_identity?.genesis_hash_status || '').trim().toLowerCase();
            if (identifierHash !== bundled.hash || identifierMagic !== bundled.magic) {
              throw new Error(`Network identifiers do not match bundled genesis. identifiers=${identifierHash}/${identifierMagic} bundled=${bundled.hash}/${bundled.magic}`);
            }
            if (identifierChainHex && identifierChainHex !== '0x4f2') {
              throw new Error(`Network identifiers must declare chain_id_hex 0x4f2. got=${identifierChainHex}`);
            }
            if (identifierStatus.includes('candidate') || identifierStatus.includes('pending')) {
              throw new Error(`Network identifiers are not final: ${identifierStatus}`);
            }

            const manifest = readJson('testnet/runtime/workspace-manifest.json');
            if (manifest?.chain_id !== 1266 && manifest?.chainId !== 1266) {
              throw new Error('Workspace manifest must declare chain ID 1266');
            }
            if (manifest?.chain_id_hex !== '0x4f2') {
              throw new Error('Workspace manifest must declare chain_id_hex 0x4f2');
            }
            if (manifest?.network_id !== 'synergy-testnet-v3') {
              throw new Error('Workspace manifest must declare network_id synergy-testnet-v3');
            }

            console.log(`Testnet genesis alignment OK: ${bundled.hash}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: control-service -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare native terminal dependencies
        run: npm run prepare:native-deps

      - name: Build bundled Aegis snapshot verifier
        shell: bash
        run: |
          set -euo pipefail

          case "${RUNNER_OS}" in
            Linux)
              verifier_name="synergy-aegis-linux-amd64"
              ;;
            macOS)
              verifier_name="synergy-aegis-darwin-arm64"
              ;;
            *)
              echo "No supported Aegis verifier bundle target for ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

          mkdir -p binaries
          bash scripts/build-aegis-snapshot-verifier.sh \
            --aegis-pqvm "$GITHUB_WORKSPACE/aegis-pqvm-source" \
            --output "binaries/${verifier_name}"
          "binaries/${verifier_name}" --version
          bash scripts/qa/aegis-snapshot-verifier-test.sh "binaries/${verifier_name}"

      - name: Download tagged Testnet-v3 runtime artifacts
        uses: actions/download-artifact@v4
        with:
          name: testnet-v3-runtime-linux-amd64
          path: runtime/node-control-panel/.release-runtime/linux-amd64

      - name: Download tagged Testnet-v3 macOS runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: testnet-v3-runtime-macos-arm64
          path: runtime/node-control-panel/.release-runtime/macos-arm64

      - name: Stage exact Testnet-v3 runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p binaries
          linux_binary="$(find .release-runtime/linux-amd64 -type f -name synergy-testnet-linux-amd64 -print -quit)"
          macos_binary="$(find .release-runtime/macos-arm64 -type f -name synergy-testnet-darwin-arm64 -print -quit)"
          [[ -n "$linux_binary" && -n "$macos_binary" ]] || {
            echo "The tagged Testnet-v3 Linux and macOS runtime artifacts are both required." >&2
            find .release-runtime -maxdepth 4 -type f -print >&2 || true
            exit 1
          }
          install -m 0755 "$linux_binary" binaries/synergy-testnet-linux-amd64
          install -m 0755 "$macos_binary" binaries/synergy-testnet-darwin-arm64
          cp binaries/synergy-testnet-darwin-arm64 binaries/synergy-testnet-macos-arm64
          chmod +x binaries/synergy-testnet-linux-amd64 binaries/synergy-testnet-darwin-arm64 binaries/synergy-testnet-macos-arm64
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const sha256 = (filePath) => crypto.createHash('sha256').update(fs.readFileSync(filePath)).digest('hex');
          const version = require('./package.json').version;
          const sourceRepository = process.env.GITHUB_REPOSITORY;
          const sourceRevision = process.env.GITHUB_SHA;
          const manifest = {
            schema_version: 1,
            network_id: 'synergy-testnet-v3',
            source_repository: sourceRepository,
            source_revision: sourceRevision,
            version: `v${version}`,
            binaries: {
              'linux-amd64': {
                'synergy-testnet': {
                  file: 'synergy-testnet-linux-amd64',
                  sha256: sha256('binaries/synergy-testnet-linux-amd64'),
                },
              },
              'macos-arm64': {
                'synergy-testnet': {
                  file: 'synergy-testnet-darwin-arm64',
                  sha256: sha256('binaries/synergy-testnet-darwin-arm64'),
                },
              },
            },
          };
          fs.writeFileSync('testnet-latest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Verify Control Panel and Testnet runtime version alignment
        shell: bash
        run: |
          set -euo pipefail

          control_panel_version="$(node -p "require('./package.json').version")"
          expected_runtime_ref="v${control_panel_version}"
          source_version="$(awk -F '"' '/^version = "/ { print $2; exit }' "$GITHUB_WORKSPACE/runtime/src/Cargo.toml")"
          if [[ "${source_version}" != "${control_panel_version}" ]]; then
            echo "Testnet source package version ${source_version} does not match Control Panel ${control_panel_version}" >&2
            exit 1
          fi

          manifest_version="$(node -p "require('./testnet-latest.json').version")"
          if [[ "${manifest_version}" != "${expected_runtime_ref}" ]]; then
            echo "Testnet manifest version ${manifest_version} does not match ${expected_runtime_ref}" >&2
            exit 1
          fi
          manifest_repository="$(node -p "require('./testnet-latest.json').source_repository")"
          manifest_revision="$(node -p "require('./testnet-latest.json').source_revision")"
          [[ "${manifest_repository}" == "${TESTNET_V3_SOURCE_REPOSITORY}" ]] || {
            echo "Runtime manifest source ${manifest_repository} is not ${TESTNET_V3_SOURCE_REPOSITORY}" >&2
            exit 1
          }
          [[ "${manifest_revision}" == "${GITHUB_SHA}" ]] || {
            echo "Runtime manifest source revision ${manifest_revision} does not match ${GITHUB_SHA}" >&2
            exit 1
          }

          SYNERGY_SKIP_WORKSPACE_MANIFEST_CHECK=1 node scripts/qa/runtime-version-alignment-test.mjs
          echo "Version alignment verified: Control Panel ${control_panel_version}, Testnet ${control_panel_version}"

      - name: Sync Testnet-v3 binaries into runtime installers
        shell: bash
        run: |
          set -euo pipefail

          sha256_file() {
            node -e 'const crypto = require("node:crypto"); const fs = require("node:fs"); process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"));' "$1"
          }

          write_binary_status() {
            local installer_dir="$1"
            cat > "${installer_dir}/BINARY_STATUS.txt" <<EOF
          Synergy Testnet Binary Status
          ============================

          Linux Binary
          ------------
          Path: ./bin/synergy-testnet-linux-amd64
          SHA-256: $(sha256_file "${installer_dir}/bin/synergy-testnet-linux-amd64")

          Darwin Binary
          -------------
          Path: ./bin/synergy-testnet-darwin-arm64
          SHA-256: $(sha256_file "${installer_dir}/bin/synergy-testnet-darwin-arm64")

          Interpretation
          --------------
          - These checksums reflect the exact bundled binaries shipped in this installer.
          EOF
          }

          installer_root="testnet/runtime/installers"
          if [[ ! -d "$installer_root" ]]; then
            echo "Missing runtime installer root: $installer_root" >&2
            exit 1
          fi

          for installer_dir in "$installer_root"/*; do
            [[ -d "$installer_dir" ]] || continue
            mkdir -p "$installer_dir/bin"
            cp binaries/synergy-testnet-linux-amd64 "$installer_dir/bin/synergy-testnet-linux-amd64"
            cp binaries/synergy-testnet-darwin-arm64 "$installer_dir/bin/synergy-testnet-darwin-arm64"
            chmod +x "$installer_dir/bin/synergy-testnet-linux-amd64" "$installer_dir/bin/synergy-testnet-darwin-arm64"
            write_binary_status "$installer_dir"
          done

          bash scripts/release/generate-workspace-manifest.sh
          node scripts/qa/runtime-version-alignment-test.mjs
          SKIP_BUNDLED_ASSET_GIT_CLEAN_CHECK=1 ./scripts/release/validate-bundled-assets.sh

      - name: Create .env from testnet example if missing
        shell: bash
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libarchive-tools \
            fakeroot \
            rpm \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Build renderer assets
        run: npm run build

      - name: Build headless control-service runtime
        run: cargo build --manifest-path control-service/Cargo.toml --bin control-service --release --no-default-features

      - name: Run native terminal QA
        run: npm run test:terminal-pty

      - name: Run release-critical onboarding and coordinator checks
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path control-service/Cargo.toml innernet::tests:: -- --test-threads=1
          node scripts/qa/macos-updater-policy-test.cjs
          node scripts/qa/onboarding-innernet-contract-test.cjs
          node scripts/qa/bond-stake-envelope-test.cjs
          node scripts/qa/onboarding-deterministic-contract-test.cjs
          npm run test:onboarding-monitor
          node --test scripts/qa/wallet-account-null-safety-test.mjs
          npm run test:protocol-policy
          npm run test:operations
          npm run test:visualizations
          node --test scripts/qa/testnet-telemetry-contract-test.mjs
          SYNERGY_RENDER_CONFIGS_CLUSTER_POLICY_TEST=true bash scripts/testnet/render-configs.sh
          bash scripts/qa/validator-vpn-coordinator-readiness-test.sh
          bash scripts/qa/release-retired-vpn-literal-gate-test.sh
          node scripts/qa/control-panel-uiux-revamp-check.mjs

      - name: Run macOS archive catalog persistence checks
        if: matrix.artifact_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/qa/archive-catalog-uploader-install-test.sh
          bash scripts/qa/archive-catalog-uploader-repair-test.sh

      - name: Verify bundled archive signature verifier
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux) verifier="binaries/synergy-aegis-linux-amd64" ;;
            macOS) verifier="binaries/synergy-aegis-darwin-arm64" ;;
            *) exit 1 ;;
          esac
          test -x "${verifier}"
          "${verifier}" --version

      - name: Verify staged remote onboarding sidecars
        shell: bash
        run: |
          set -euo pipefail
          test -x binaries/synergy-control-linux-amd64
          test -x binaries/synergy-testnet-agent-linux-amd64
          file binaries/synergy-control-linux-amd64 | grep -q 'ELF 64-bit'
          file binaries/synergy-testnet-agent-linux-amd64 | grep -q 'ELF 64-bit'

      - name: Stage Electron runtime bundle
        run: node scripts/electron/prepare-runtime.mjs

      - name: Remove non-portable bundled service bin shims
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="testnet/runtime/installers/Node-EXP/explorer-app"
          if [[ -d "$bundle_root" ]]; then
            find "$bundle_root" -path '*/node_modules/.bin' -type d -prune -exec rm -rf {} +
          fi

      - name: Clear stale packaged artifacts
        shell: bash
        run: rm -rf electron-dist

      - name: Verify macOS signing and notarization inputs
        if: matrix.artifact_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "${secret_name} is required for the signed macOS release build." >&2
              exit 1
            fi
          done
          echo "macOS signing and notarization inputs are present."

      - name: Build installer
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Notarize and staple macOS disk image
        if: matrix.artifact_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find electron-dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          [[ -n "$dmg_path" ]] || { echo "No macOS DMG found for notarization" >&2; exit 1; }
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"

      - name: Audit packaged installer for prohibited validator material
        shell: bash
        run: |
          set -euo pipefail
          audit_script="scripts/release/audit-installer-secret-surface.mjs"
          if [[ "${{ matrix.artifact_name }}" == "macos" ]]; then
            dmg_path="$(find electron-dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            [[ -n "$dmg_path" ]] || { echo "No macOS DMG found for installer content audit" >&2; exit 1; }
            mount_dir="$(mktemp -d)"
            cleanup() {
              hdiutil detach "$mount_dir" -quiet || true
              rm -rf "$mount_dir"
            }
            trap cleanup EXIT
            hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
            node "$audit_script" --root "$mount_dir" --label "macOS DMG"
          else
            deb_path="$(find electron-dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
            [[ -n "$deb_path" ]] || { echo "No Linux DEB found for installer content audit" >&2; exit 1; }
            extract_dir="$(mktemp -d)"
            trap 'rm -rf "$extract_dir"' EXIT
            dpkg-deb --fsys-tarfile "$deb_path" | tar -x -C "$extract_dir"
            node "$audit_script" --root "$extract_dir" --label "Linux DEB"
          fi

      - name: Remove duplicate builder-debug.yml from artifacts
        shell: bash
        run: rm -f electron-dist/builder-debug.yml

      - name: Repair updater metadata artifact names
        shell: bash
        run: python3 scripts/release/repair-electron-update-metadata.py electron-dist

      - name: Verify signed and notarized macOS installer
        if: matrix.artifact_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find electron-dist -type d -name '*.app' -print -quit)"
          dmg_path="$(find electron-dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          zip_path="$(find electron-dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          [[ -n "$app_path" ]] || { echo "No macOS app bundle found for signature validation" >&2; exit 1; }
          [[ -n "$dmg_path" ]] || { echo "No macOS DMG found for Gatekeeper validation" >&2; exit 1; }
          [[ -n "$zip_path" ]] || { echo "No macOS updater ZIP found for signature validation" >&2; exit 1; }

          assess_gatekeeper_with_quarantine() {
            local source_app="$1"
            local label="$2"
            local assessment_app="$RUNNER_TEMP/gatekeeper-${label}.app"
            local quarantine_value
            local assessment_target
            quarantine_value="0081;$(printf '%x' "$(date +%s)");GitHub Actions;${label}"

            rm -rf "$assessment_app"
            ditto "$source_app" "$assessment_app"
            if command -v xattr >/dev/null 2>&1 && xattr -w com.apple.quarantine "$quarantine_value" "$assessment_app"; then
              assessment_target="$assessment_app"
            else
              echo "Could not set synthetic quarantine for ${label}; running the direct Gatekeeper assessment." >&2
              assessment_target="$source_app"
            fi
            spctl --assess --type execute --verbose=4 "$assessment_target" || {
              rm -rf "$assessment_app"
              return 1
            }
            rm -rf "$assessment_app"
          }

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q 'Authority=Developer ID Application:'
          codesign -d --entitlements :- "$app_path" 2>/dev/null | grep -q 'com.apple.security.cs.allow-jit'
          for helper in innernet-darwin-arm64 wireguard-go wg; do
            helper_path="$app_path/Contents/Resources/innernet/$helper"
            test -x "$helper_path"
            file "$helper_path" | grep -q 'Mach-O 64-bit executable arm64'
            codesign --verify --strict --verbose=2 "$helper_path"
          done
          wg_quick_path="$app_path/Contents/Resources/innernet/wg-quick"
          test -x "$wg_quick_path"
          head -n 1 "$wg_quick_path" | grep -q '^#!'
          keygen_path="$app_path/Contents/Resources/binaries/synergy-keygen-darwin-arm64"
          test -x "$keygen_path"
          file "$keygen_path" | grep -q 'Mach-O 64-bit executable arm64'
          codesign --verify --strict --verbose=2 "$keygen_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          assess_gatekeeper_with_quarantine "$app_path" "packaged"

          zip_extract_dir="$(mktemp -d)"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rm -rf "$mount_dir" "$zip_extract_dir"
          }
          trap cleanup EXIT

          ditto -x -k "$zip_path" "$zip_extract_dir"
          updater_app="$(find "$zip_extract_dir" -type d -name '*.app' -print -quit)"
          [[ -n "$updater_app" ]] || { echo "No app bundle found inside updater ZIP" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$updater_app"
          xcrun stapler validate "$updater_app"
          assess_gatekeeper_with_quarantine "$updater_app" "updater-zip"

          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          mounted_app="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$mounted_app" ]] || { echo "No app bundle found inside notarized DMG" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$mounted_app"
          xcrun stapler validate "$mounted_app"
          assess_gatekeeper_with_quarantine "$mounted_app" "notarized-dmg"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  publish-releases-repo:
    name: Publish installers to releases repo
    needs:
      - verify-release-identity
      - build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Checkout source for operator manual archive
        uses: actions/checkout@v4

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: runtime/node-control-panel/release-assets/macos

      - name: Download Linux installers
        uses: actions/download-artifact@v4
        with:
          name: installer-linux
          path: runtime/node-control-panel/release-assets/linux

      - name: Verify complete installer release set
        shell: bash
        run: |
          set -euo pipefail
          require_asset() {
            local label="$1"
            local pattern="$2"
            compgen -G "$pattern" >/dev/null || {
              echo "Missing required ${label} asset matching ${pattern}" >&2
              find release-assets -maxdepth 3 -type f -print >&2 || true
              exit 1
            }
          }
          require_asset "macOS DMG" 'release-assets/macos/*.dmg'
          require_asset "macOS ZIP" 'release-assets/macos/*.zip'
          require_asset "macOS update metadata" 'release-assets/macos/*.yml'
          require_asset "Linux Debian package" 'release-assets/linux/*.deb'
          require_asset "Linux AppImage" 'release-assets/linux/*.AppImage'
          require_asset "Linux update metadata" 'release-assets/linux/*.yml'

      - name: Create versioned operator manual archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify-release-identity.outputs.version }}
        run: |
          set -euo pipefail
          archive="release-assets/Synergy.Node.Control.Panel-${RELEASE_VERSION}-operator-manual.tar.gz"
          tar -czf "$archive" -C docs \
            operator-manual/README.md \
            operator-manual/macos.md \
            operator-manual/ubuntu-desktop.md \
            operator-manual/headless-ubuntu-linux.md \
            operator-manual/validator-lifecycle.md
          tar -tzf "$archive" > "$RUNNER_TEMP/operator-manual-files.txt"
          grep -Fxq 'operator-manual/README.md' "$RUNNER_TEMP/operator-manual-files.txt"
          grep -Fxq 'operator-manual/macos.md' "$RUNNER_TEMP/operator-manual-files.txt"
          grep -Fxq 'operator-manual/ubuntu-desktop.md' "$RUNNER_TEMP/operator-manual-files.txt"
          grep -Fxq 'operator-manual/headless-ubuntu-linux.md' "$RUNNER_TEMP/operator-manual-files.txt"
          grep -Fxq 'operator-manual/validator-lifecycle.md' "$RUNNER_TEMP/operator-manual-files.txt"
          test -s "$archive"

      - name: Verify complete release set
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'release-assets/Synergy.Node.Control.Panel-*-operator-manual.tar.gz' >/dev/null || {
            echo "Missing versioned operator manual archive" >&2
            find release-assets -maxdepth 2 -type f -print >&2 || true
            exit 1
          }

      - name: Create release checksums
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  release-assets/#  #' > release-assets/SHA256SUMS
          test -s release-assets/SHA256SUMS

      - name: Publish complete installer release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="synergy-network-hq/synergy-node-control-panel-releases"
          title="Synergy Node Control Panel ${tag#v}"
          notes="Automated build from ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repo" --title "$title" --notes "$notes"
          else
            gh release edit "$tag" --repo "$repo" --title "$title" --notes "$notes"
          fi
          find release-assets -type f -print0 | xargs -0 gh release upload "$tag" --repo "$repo" --clobber
