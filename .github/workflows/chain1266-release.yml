name: Chain 1266 Node Platform Candidate

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Governed candidate release identifier
        required: true
        type: string
      source_revision:
        description: Exact approved Core Protocol commit SHA
        required: true
        type: string

concurrency:
  group: chain1266-node-platform-candidate
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

jobs:
  candidate:
    name: Build non-deploying universal-node candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Bind candidate to approved source
        shell: bash
        env:
          EXPECTED_REVISION: ${{ inputs.source_revision }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_REVISION" ]]
          [[ "$RELEASE_ID" =~ ^[A-Za-z0-9._-]{1,128}$ ]]

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt

      - name: Capture complete source and vendored input inventory
        run: python3 node-platform/tools/release/provenance.py inventory --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/build-inputs-before.json"

      - name: Build candidate bytes once
        working-directory: node-platform
        run: cargo build --locked --release --package synergy-node --package synergy-keytool --package synergy-genesis --features synergy-node/qualification-timing

      - name: Compile native fixture exporter companion once
        working-directory: node-platform
        run: |
          set -euo pipefail
          cargo build --locked --release --package synergy-node --tests --features qualification-timing --message-format=json >"$RUNNER_TEMP/exporter-build.jsonl"
          python3 tools/release/provenance.py exporter --cargo-messages "$RUNNER_TEMP/exporter-build.jsonl" >"$RUNNER_TEMP/fixture-exporter-path.txt"

      - name: Check integrated source after implementation freeze
        working-directory: node-platform
        env:
          AEGIS_LICENSE_SECRET: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked --no-fail-fast

      - name: Bind exact artifact to unchanged complete build inputs
        run: |
          set -euo pipefail
          python3 node-platform/tools/release/provenance.py inventory --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/build-inputs-after.json"
          python3 node-platform/tools/release/provenance.py assemble \
            --before "$RUNNER_TEMP/build-inputs-before.json" --after "$RUNNER_TEMP/build-inputs-after.json" \
            --binary node-platform/target/release/synergy-node \
            --keytool node-platform/target/release/synergy-keytool --genesis node-platform/target/release/synergy-genesis \
            --fixture-exporter "$(cat "$RUNNER_TEMP/fixture-exporter-path.txt")" --feature qualification-timing --output "$RUNNER_TEMP/build-provenance.json"

      - name: Assemble bounded candidate artifact
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$RELEASE_ID"
          install -d -m 0755 "$out/bin" "$out/evidence"
          install -m 0755 node-platform/target/release/synergy-node "$out/bin/synergy-node"
          install -m 0755 node-platform/target/release/synergy-keytool "$out/bin/synergy-keytool"
          install -m 0755 node-platform/target/release/synergy-genesis "$out/bin/synergy-genesis"
          install -m 0755 "$(cat "$RUNNER_TEMP/fixture-exporter-path.txt")" "$out/bin/synergy-fixture-exporter"
          install -m 0644 "$RUNNER_TEMP/build-provenance.json" "$out/evidence/build-provenance.json"
          printf '%s\n' 'unqualified_candidate; native full-process and explicit approval required' >"$out/evidence/qualification-state.txt"
          printf '%s\n' "$RELEASE_ID" >"$out/evidence/release-id.txt"
          printf '%s\n' "$SOURCE_REVISION" >"$out/evidence/source-revision.txt"
          (cd "$out" && find . -type f ! -path './evidence/SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum >evidence/SHA256SUMS)
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$RELEASE_ID.tar.gz" "$RELEASE_ID"

      - name: Install isolated Linux qualification dependencies
        run: sudo apt-get install -y iproute2 util-linux python3-cryptography

      - name: Execute exact candidate in isolated native restart and quorum scenarios
        shell: bash
        env:
          AEGIS_LICENSE_SECRET: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
        run: |
          set -euo pipefail
          fixture="/tmp/posy-isolated-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node="$GITHUB_WORKSPACE/node-platform/target/release/synergy-node"
          keytool="$GITHUB_WORKSPACE/node-platform/target/release/synergy-keytool"
          genesis="$GITHUB_WORKSPACE/node-platform/target/release/synergy-genesis"
          setup="$GITHUB_WORKSPACE/node-platform/tools/validator/run-isolated-posy-qualification.py"
          exporter="$(cat "$RUNNER_TEMP/fixture-exporter-path.txt")"
          launcher="$GITHUB_WORKSPACE/node-platform/tools/validator/qualify-posy-process-fleet.py"
          baseline="$GITHUB_WORKSPACE/node-platform/tools/validator/run-posy-tps-baseline.py"
          sudo env PATH="$PATH" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" AEGIS_LICENSE_SECRET="$AEGIS_LICENSE_SECRET" \
            unshare --net -- python3 "$setup" --execute --export-fresh --fixture "$fixture" \
            --binary "$node" --keytool "$keytool" --genesis "$genesis" --fixture-exporter "$exporter" --launcher "$launcher" --baseline-harness "$baseline" --provenance "$RUNNER_TEMP/build-provenance.json" \
            --run-id ci-restart --fault-kind restart --duration-seconds 360 --epoch-end-height 1000000 \
            --gas-limit 21000 --max-fee-per-gas-nwei 40 --gas-class-units 21000
          sudo env PATH="$PATH" unshare --net -- python3 "$setup" --execute --fixture "$fixture" \
            --transport-secret "$fixture/transport-attestation.secret.bin" \
            --binary "$node" --keytool "$keytool" --genesis "$genesis" --fixture-exporter "$exporter" --launcher "$launcher" --baseline-harness "$baseline" --provenance "$RUNNER_TEMP/build-provenance.json" \
            --run-id ci-quorum --fault-kind quorum --duration-seconds 360 \
            --gas-limit 21000 --max-fee-per-gas-nwei 40 --gas-class-units 21000
          sudo python3 node-platform/tools/release/aggregate-qualification.py \
            --binary "$node" --provenance "$RUNNER_TEMP/build-provenance.json" --fixture "$fixture" \
            --funded-report "$fixture/qualification-ci-restart/steady-state-transfer.json" \
            --baseline-report "$fixture/qualification-ci-restart/baseline-30.json" \
            --restart-launcher-report "$fixture/qualification-ci-restart/launcher.stdout.json" \
            --restart-observations "$fixture/qualification-ci-restart/native-observations.json" \
            --quorum-launcher-report "$fixture/qualification-ci-quorum/launcher.stdout.json" \
            --quorum-proof "$fixture/qualification-ci-quorum/qualification-fault-events.json" \
            --output "$fixture/qualification.json"
          # These primary native proofs do not replace the remaining full protocol/model gate.
          # Do not upload synthetic custody. Candidate bytes remain unchanged and unqualified.
          sudo install -m 0644 "$fixture/qualification.json" "$RUNNER_TEMP/${{ inputs.release_id }}/evidence/primary-scenario-report.json"
          (cd "$RUNNER_TEMP/${{ inputs.release_id }}" && find . -type f ! -path './evidence/SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum >evidence/SHA256SUMS)
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/${{ inputs.release_id }}.tar.gz" "${{ inputs.release_id }}"

      - name: Upload unchanged unqualified bytes for native full-process qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.release_id }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/${{ inputs.release_id }}.tar.gz
