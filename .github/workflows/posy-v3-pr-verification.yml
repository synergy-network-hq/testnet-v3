name: Node Platform Verification

on:
  pull_request:
    paths:
      - ".github/workflows/posy-v3-pr-verification.yml"
      - "node-platform/**"
      - "protocol/**"
      - "networks/**"
      - "docs/refactor/**"
  workflow_dispatch:

concurrency:
  group: node-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  verify:
    name: Canonical node-platform format, lint, and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt

      - name: Verify formatting
        working-directory: node-platform
        run: cargo fmt --all -- --check

      - name: Reject warnings across every target
        working-directory: node-platform
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run canonical workspace tests
        working-directory: node-platform
        env:
          AEGIS_LICENSE_SECRET: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
        run: cargo test --workspace --locked --no-fail-fast
