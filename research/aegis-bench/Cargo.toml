[package]
name = "synergy-aegis-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aegis-pqvm = { path = "../../runtime/aegis-pqvm", default-features = false, features = ["mldsa", "fndsa", "security"] }
libc = "0.2"
pqrust-traits = { path = "../../../synq-language/pqrust/pqrust-traits", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
synergy-testnet = { path = "../../runtime/src" }

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = false
codegen-units = 16
panic = "unwind"
